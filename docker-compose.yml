# Only services that exist and are tested are listed. Application services
# are added here as each Building is completed (see docs/architecture/BUILD_STATUS.md).
#
# Nothing in this file publishes a port to the public internet. Postgres and
# Redis bind to 127.0.0.1 for local development only; in production remove
# the `ports:` entries entirely.

name: pumpfun

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pumpfun}
      POSTGRES_USER: ${POSTGRES_USER:-pumpfun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redisdata:/data
    networks: [internal]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

networks:
  internal:
    internal: true

volumes:
  pgdata:
  redisdata:
