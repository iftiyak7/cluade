{{define "content"}}
<section class="card narrow">
  <h1>Change password</h1>
  <p class="muted">At least 12 characters. All other sessions will be signed out.</p>
  <form method="post" action="/admin/password">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label>Current password <input type="password" name="current" required autocomplete="current-password" maxlength="72"></label>
    <label>New password <input type="password" name="new" required minlength="12" maxlength="72" autocomplete="new-password"></label>
    <label>Repeat new password <input type="password" name="repeat" required minlength="12" maxlength="72" autocomplete="new-password"></label>
    <button class="primary">Change password</button>
  </form>
</section>
{{end}}
