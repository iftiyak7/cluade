# Hayat on a VPS: API + admin + landing page, PostgreSQL, and Caddy (automatic HTTPS).
# Usage: see deploy/README.md. All settings come from deploy/.env (copy .env.example).
name: hayat

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hayat
      POSTGRES_USER: hayat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hayat -d hayat"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    # No published ports: only the api container can reach the database.

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: hayat-server:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HAYAT_DATABASE_URL: postgres://hayat:${POSTGRES_PASSWORD}@postgres:5432/hayat?sslmode=disable
      HAYAT_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (min 32 characters)}
      HAYAT_SIGNUP: ${SIGNUP:-open}
      HAYAT_CORS_ORIGINS: ${CORS_ORIGINS:-}
      HAYAT_ADMIN_TZ: ${ADMIN_TZ:-Asia/Dhaka}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal, web]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  web:
