# For servers that already run CloudPanel (or another web server) on ports 80/443.
# CloudPanel's nginx terminates HTTPS and proxies to the api on 127.0.0.1:8080; Caddy is not used.
# Usage:  docker compose -f compose.yaml -f compose.cloudpanel.yaml up -d --build postgres api
services:
  api:
    ports:
      - "127.0.0.1:${HAYAT_PORT:-18090}:8080"   # localhost only (8080 is often used by CloudPanel itself)
